<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena · teste responsivo</title><style>
*{box-sizing:border-box}body{margin:0;background:#08111c;color:#dce7f0;font:14px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #304254}h1{font-size:17px;margin:0}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;min-height:40px;padding:8px 12px;border-radius:8px;background:#182c3d;color:#fff;border:1px solid #5b7891}.screens{display:flex;gap:20px;justify-content:center;align-items:start;padding:18px;overflow:auto}.device{flex:none}.device p{margin:0 0 8px;text-align:center;color:#a8bece}iframe{display:block;background:#08111c;border:1px solid #58718c;border-radius:16px;width:390px;height:780px}.desktop iframe{width:1000px}.desktop[hidden]{display:none}output{font-size:12px;color:#8ee7ba}body:has(.desktop:not([hidden])) .screens{justify-content:start}
</style><header><h1>Arena · teste responsivo</h1><label>Tela <select id="viewport"><option value="320">320 px</option><option value="360">360 px</option><option value="390" selected>390 px</option><option value="412">412 px</option><option value="768">Tablet · 768 px</option><option value="1366">PC · 1366 px</option></select></label><button id="mixed" type="button" aria-pressed="false">Celular + PC</button><button id="report" type="button">Conferir largura</button><output id="result" aria-live="polite"></output></header><main class="screens"><section class="device"><p id="deviceName">Celular · 390 × 780</p><iframe id="phone" src="../index.html" title="Arena no celular"></iframe></section><section class="device desktop" hidden><p>PC · 1000 × 780</p><iframe id="desktop" src="../index.html" title="Arena no PC"></iframe></section></main><script>
const $=id=>document.getElementById(id);$('viewport').onchange=()=>{const w=+$('viewport').value;$('phone').style.width=w+'px';$('deviceName').textContent=(w>760?'PC / tablet':'Celular')+' · '+w+' × 780';$('result').textContent='';};$('mixed').onclick=()=>{const section=document.querySelector('.desktop');section.hidden=!section.hidden;$('mixed').setAttribute('aria-pressed',String(!section.hidden));};$('report').onclick=()=>{const d=$('phone').contentDocument;$('result').textContent=d.documentElement.scrollWidth<=d.documentElement.clientWidth?'✓ Sem rolagem horizontal':`Largura extra: ${d.documentElement.scrollWidth-d.documentElement.clientWidth}px`;};
</script></html>
